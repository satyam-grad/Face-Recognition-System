<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students · Face Recognition</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-page="students">
<div class="wrap">
  <header>
    <h1>Face Recognition</h1>
    <nav class="nav">
      <a href="/" data-nav="students">Students</a>
      <a href="/camera" data-nav="camera">Camera</a>
      <a href="/enroll" data-nav="enroll">Add student</a>
    </nav>
    <span class="spacer"></span>
    <button type="button" class="btn danger" id="quitBtn">Quit app</button>
  </header>

  <main class="wide">
    <section class="card">
      <div class="card-head">
        <h2>Students</h2>
        <div class="actions">
          <span id="studentCount" class="pill">0 students</span>
          <button type="button" class="btn" id="refreshStudents">Refresh</button>
        </div>
      </div>
      <div class="table-wrap" id="studentsTableWrap">
        <table id="studentsTable">
          <thead><tr><th>Full name</th><th>Class</th><th>Year</th><th>Roll no</th><th>Today</th></tr></thead>
          <tbody id="studentBody"></tbody>
        </table>
      </div>
      <p class="muted" style="margin: 10px 0 0;">Click a student to see their attendance history.</p>
    </section>
  </main>
</div>

<div id="stopped" class="overlay" role="alert" hidden>
  <div class="overlay-card">
    <h2>App stopped</h2>
    <p>The camera is released and the server has shut down. You can close this tab.</p>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
